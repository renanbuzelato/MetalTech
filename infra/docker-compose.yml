services:
  # 1. Broker MQTT (Mosquitto)
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: metaltech-mqtt
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
    networks:
      - metaltech-net

  # 2. Banco de Dados PostgreSQL
  postgres-db:
    image: postgres:15-alpine
    container_name: metaltech-db
    restart: always
    environment:
      POSTGRES_DB: metaltech_db
      POSTGRES_USER: metaltech_user
      POSTGRES_PASSWORD: SecretPassword123!
    ports:
      - "5432:5432"
    volumes:
      - dados-manutencao:/var/lib/postgresql/data
    networks:
      - metaltech-net

  # 3. API Back-end Java Spring Boot
  api-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: metaltech-api
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db
      - mqtt-broker
    networks:
      - metaltech-net

volumes:
  dados-manutencao:
    external: false
  mosquitto-data:
    external: false

networks:
  metaltech-net:
    driver: bridge