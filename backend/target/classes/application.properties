server.port=8080

# Conexao com o PostgreSQL (Container metaltech-db)
spring.datasource.url=jdbc:postgresql://metaltech-db:5432/metaltech_db
spring.datasource.username=metaltech_user
spring.datasource.password=SecretPassword123!
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialeto JPA / Hibernate explicito
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Conexao com o Mosquitto MQTT Broker (Container metaltech-mqtt)
mqtt.broker.url=tcp://metaltech-mqtt:1883